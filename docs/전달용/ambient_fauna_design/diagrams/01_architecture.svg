<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" width="1120" height="590" role="img" aria-label="CPU는 장소를, GPU는 개체를 관리한다"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#78999c"/></marker></defs><rect width="1120" height="590" rx="18" fill="#122a35"/><g font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="42" font-size="24" font-weight="700" fill="#f0f5ed">CPU는 장소를, GPU는 개체를 관리한다</text><text x="32" y="70" font-size="14" fill="#b6c9ca">자체 설계 도식 · 프로젝트 서비스는 어댑터를 통해 연결</text><rect x="32" y="100" width="240" height="85" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="152.0" y="130" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">월드·셀</text><text x="152.0" y="156" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">등록 / 언로드</text><rect x="304" y="100" width="240" height="85" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="424.0" y="130" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">시간·날씨</text><text x="424.0" y="156" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">낮·밤 / 비 / 바람</text><rect x="576" y="100" width="240" height="85" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="696.0" y="130" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">플레이어·카메라</text><text x="696.0" y="156" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">위치 / 접근 / 전투</text><rect x="848" y="100" width="240" height="85" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="968.0" y="130" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">프로필·에셋</text><text x="968.0" y="156" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">종 / 외형 / 품질</text><path d="M560 185 L560 208 L300 208 L300 230" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="230" width="512" height="282" rx="14" fill="#193740" stroke="#54757b"/><text x="58" y="265" font-size="19" fill="#f0f5ed" text-anchor="start" font-weight="700">CPU / 서식지 단위</text><rect x="58" y="285" width="220" height="86" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="168.0" y="315" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">서비스·상태 머신</text><text x="168.0" y="341" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">준비 → 활성 → 퇴장</text><rect x="298" y="285" width="220" height="86" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="408.0" y="315" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">예산·풀</text><text x="408.0" y="341" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">Capacity / 그룹 상한</text><rect x="58" y="395" width="460" height="86" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="288.0" y="425" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">GPU 입력 작성</text><text x="288.0" y="451" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">앵커 / 자극 / 경계 / 시각 파라미터</text><path d="M168 371 L168 395" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><path d="M408 371 L408 395" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><rect x="584" y="230" width="504" height="282" rx="14" fill="#193740" stroke="#54757b"/><text x="610" y="265" font-size="19" fill="#f0f5ed" text-anchor="start" font-weight="700">GPU / 개체 단위</text><rect x="610" y="285" width="452" height="86" rx="12" fill="#325c60" stroke="#54757b" stroke-width="1"/><text x="836.0" y="315" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">시뮬레이션</text><text x="836.0" y="341" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">배회 / 도주 / 경계 복귀</text><rect x="610" y="395" width="452" height="86" rx="12" fill="#325c60" stroke="#54757b" stroke-width="1"/><text x="836.0" y="425" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">렌더링</text><text x="836.0" y="451" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">날갯짓 / 알파 / 발광 / 카메라 fade</text><path d="M518 438 L564 438 L564 328 L610 328" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><path d="M836 371 L836 395" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="553" font-size="17" fill="#ebd7a7" text-anchor="middle" font-weight="400">정상 경로: 개체별 CPU 오브젝트 없음 · GPU 위치 readback 없음</text></g></svg>