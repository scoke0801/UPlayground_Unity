<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-label="메시·UV·텍스처·셰이더는 같은 계약을 사용한다"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#78999c"/></marker></defs><rect width="1120" height="620" rx="18" fill="#122a35"/><g font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="42" font-size="24" font-weight="700" fill="#f0f5ed">메시·UV·텍스처·셰이더는 같은 계약을 사용한다</text><text x="32" y="70" font-size="14" fill="#b6c9ca">기술 도식 · 실제 생성 모델이나 완성 텍스처가 아닌 제작 규격 설명</text><rect x="32" y="100" width="500" height="345" rx="14" fill="#193740" stroke="#54757b"/><text x="56" y="132" font-size="18" fill="#f0f5ed" text-anchor="start" font-weight="700">Unity 상면 기준 · 날개 평면 XZ</text><path d="M265 253 C221 185 124 164 102 203 C84 232 154 279 214 284 C164 305 159 354 203 356 C240 356 256 300 265 274Z" fill="#78ada1" stroke="#d2e8d4" stroke-width="2"/><path d="M299 253 C343 185 440 164 462 203 C480 232 410 279 350 284 C400 305 405 354 361 356 C324 356 308 300 299 274Z" fill="#cca26b" stroke="#f0d9b3" stroke-width="2"/><ellipse cx="282" cy="270" rx="16" ry="62" fill="#d7ddd0"/><circle cx="265" cy="267" r="6" fill="#f5f5ef"/><circle cx="299" cy="267" r="6" fill="#f5f5ef"/><text x="153" y="379" font-size="15" fill="#f0f5ed" text-anchor="middle" font-weight="400">side = -1</text><text x="410" y="379" font-size="15" fill="#f0f5ed" text-anchor="middle" font-weight="400">side = +1</text><path d="M282 211 L282 158" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><text x="293" y="175" font-size="16" fill="#b6c9ca" text-anchor="start" font-weight="400">+Z</text><path d="M282 408 L350 408" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><text x="365" y="414" font-size="16" fill="#b6c9ca" text-anchor="start" font-weight="400">+X</text><text x="84" y="415" font-size="14" fill="#b6c9ca" text-anchor="start" font-weight="400">root hinge</text><path d="M170 405 L240 335 L265 274" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="564" y="100" width="524" height="94" rx="12" fill="#325c60" stroke="#54757b" stroke-width="1"/><text x="826.0" y="130" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">UV0 / 외형</text><text x="826.0" y="156" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">컬러 + 알파 아틀라스</text><text x="826.0" y="179" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">ImageGen은 무늬 원본을 제작</text><rect x="564" y="216" width="524" height="94" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="826.0" y="246" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">UV1 + UV2 / 변형 데이터</text><text x="826.0" y="272" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">좌우 식별 · 변형 가중치 · hinge 좌표</text><text x="826.0" y="295" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">UV lightmap 생성으로 덮어쓰지 않기</text><rect x="564" y="332" width="524" height="113" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="826.0" y="362" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">Shader / 개체별 위상</text><text x="826.0" y="388" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">angle = A × sin(2πft + phase)</text><text x="826.0" y="411" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">위치와 법선의 날개 변형 일치</text><text x="826.0" y="434" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">몸체는 고정, 개체별 phase 분산</text><rect x="32" y="490" width="222" height="88" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="143.0" y="520" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">ImageGen 원본</text><text x="143.0" y="546" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">컬러 / 무늬 후보</text><rect x="310" y="490" width="222" height="88" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="421.0" y="520" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">가공·패킹</text><text x="421.0" y="546" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">마스크 / padding / UV</text><rect x="588" y="490" width="222" height="88" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="699.0" y="520" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">Unity 임포트</text><text x="699.0" y="546" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">축 / alpha / 채널</text><rect x="866" y="490" width="222" height="88" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="977.0" y="520" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">인게임 검수</text><text x="977.0" y="546" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">날갯짓 / 거리 / 조명</text><path d="M254 534 L310 534" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><path d="M532 534 L588 534" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><path d="M810 534 L866 534" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/></g></svg>