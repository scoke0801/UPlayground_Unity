<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이콘 분할기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#0e1014; --panel:#16191f; --panel2:#1c2029; --border:#2a2f3a;
    --text:#e8ebf0; --muted:#7d8697; --accent:#37d0bf; --accent-dim:rgba(55,208,191,.14);
    --warn:#e0a758; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.5;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:32px 24px 64px}
  header h1{font-size:22px; font-weight:650; letter-spacing:-.01em; margin:0 0 4px}
  header p{color:var(--muted); font-size:14px; margin:0 0 28px}

  /* 파일 드롭 영역 */
  #drop{
    border:1.5px dashed var(--border); border-radius:12px; padding:40px 24px;
    text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
  }
  #drop.over{border-color:var(--accent); background:var(--accent-dim)}
  #drop strong{color:var(--accent)}
  #drop small{display:block; color:var(--muted); margin-top:6px; font-size:13px}

  .grid{display:grid; grid-template-columns:280px 1fr; gap:24px; margin-top:24px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px}
  .panel h2{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 16px; font-weight:600}

  .field{margin-bottom:18px}
  .field label{display:flex; justify-content:space-between; font-size:13px; margin-bottom:7px}
  .field label b{font-family:var(--mono); color:var(--accent); font-weight:500}
  input[type=range]{width:100%; accent-color:var(--accent)}
  input[type=number],input[type=text]{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:7px; padding:7px 9px; font-family:var(--mono); font-size:13px;
  }
  .row2{display:flex; gap:8px} .row2>*{flex:1}

  .stat{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:12px 14px; background:var(--panel2); border-radius:8px; margin-bottom:16px;
  }
  .stat .n{font-family:var(--mono); font-size:24px; font-weight:600; color:var(--accent)}
  .stat .m{font-size:12px; color:var(--muted); font-family:var(--mono)}

  button{
    width:100%; background:var(--accent); color:#04120f; border:0; border-radius:8px;
    padding:11px; font-size:14px; font-weight:600; cursor:pointer; transition:opacity .15s;
  }
  button:hover{opacity:.88} button:disabled{opacity:.4; cursor:default}

  /* 체커보드(투명 표현) */
  .checker{
    background-color:#20242c;
    background-image:
      linear-gradient(45deg,#2a2f38 25%,transparent 25%,transparent 75%,#2a2f38 75%),
      linear-gradient(45deg,#2a2f38 25%,transparent 25%,transparent 75%,#2a2f38 75%);
    background-size:16px 16px; background-position:0 0,8px 8px;
  }
  #overlayWrap{border:1px solid var(--border); border-radius:10px; overflow:hidden}
  #overlay{display:block; width:100%; height:auto}

  #tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; margin-top:16px}
  .tile{border:1px solid var(--border); border-radius:8px; padding:8px; position:relative; cursor:pointer}
  .tile canvas{display:block; width:100%; height:auto; border-radius:5px}
  .tile span{position:absolute; top:4px; left:6px; font-family:var(--mono); font-size:11px; color:var(--muted)}
  .tile:hover{border-color:var(--accent)}
  .empty{color:var(--muted); font-size:14px; padding:40px 0; text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>아이콘 분할기</h1>
    <p>투명 배경 아이콘 시트에서 개별 아이콘을 감지해 같은 크기로 잘라냅니다.</p>
  </header>

  <div id="drop">
    <strong>이미지 선택</strong> 또는 여기로 드래그
    <small>투명 PNG 권장 · 단색 배경 이미지도 자동 인식</small>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

  <div class="grid" id="workspace" style="display:none">
    <div class="panel">
      <h2>설정</h2>
      <div class="field">
        <label>전경 임계값 <b id="vThresh">40</b></label>
        <input type="range" id="thresh" min="1" max="250" value="40">
      </div>
      <div class="field">
        <label>최소 아이콘 크기(px²) <b id="vMin">200</b></label>
        <input type="range" id="minArea" min="10" max="2000" value="200" step="10">
      </div>
      <div class="field">
        <label>조각 병합 간격 <b id="vGap">20</b></label>
        <input type="range" id="gap" min="0" max="80" value="20">
      </div>
      <div class="field">
        <label>여백(padding) <b id="vPad">12</b></label>
        <input type="range" id="pad" min="0" max="60" value="12">
      </div>
      <div class="field">
        <label>타일 크기</label>
        <div class="row2">
          <input type="number" id="tileSize" placeholder="자동" min="1">
          <input type="text" id="prefix" value="icon" title="파일명 접두어">
        </div>
      </div>
      <button id="download" disabled>ZIP으로 전체 저장</button>
    </div>

    <div class="panel">
      <h2>미리보기</h2>
      <div class="stat">
        <span class="n" id="count">0</span>
        <span class="m" id="dims">–</span>
      </div>
      <div id="overlayWrap" class="checker"><canvas id="overlay"></canvas></div>
      <div id="tiles"><div class="empty">이미지를 불러오세요</div></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let img = null, boxes = [], tileCanvases = [];

/* ---------- 파일 로딩 ---------- */
const drop = $('drop'), fileInput = $('file');
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); };
fileInput.onchange = e => load(e.target.files[0]);

function load(f){
  if(!f) return;
  const r = new FileReader();
  r.onload = () => { img = new Image(); img.onload = () => { $('workspace').style.display='grid'; run(); }; img.src = r.result; };
  r.readAsDataURL(f);
}

/* ---------- 설정 변경 시 재실행 ---------- */
['thresh','minArea','gap','pad','tileSize'].forEach(id => $(id).oninput = () => { syncLabels(); run(); });
$('prefix').oninput = () => {};
function syncLabels(){
  $('vThresh').textContent = $('thresh').value;
  $('vMin').textContent = $('minArea').value;
  $('vGap').textContent = $('gap').value;
  $('vPad').textContent = $('pad').value;
}

/* ---------- 메인 파이프라인 ---------- */
function run(){
  if(!img) return;
  const w = img.width, h = img.height;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, w, h).data;

  const fg = foregroundMask(data, w, h, +$('thresh').value);
  let found = label(fg, w, h);
  found = found.filter(b => b.area >= +$('minArea').value);
  found = mergeBoxes(found, +$('gap').value);
  found = dropOutliers(found, w, h);
  boxes = sortReading(found);

  drawOverlay(cv, w, h);
  makeTiles(img);
}

/* 전경 마스크: 알파가 있으면 알파 기준, 없으면 모서리색 대비 기준 */
function foregroundMask(d, w, h, thresh){
  let hasAlpha = false;
  for(let i = 3; i < d.length; i += 4) if(d[i] < 250){ hasAlpha = true; break; }
  const fg = new Uint8Array(w*h);
  if(hasAlpha){
    for(let i = 0; i < w*h; i++) fg[i] = d[i*4+3] > thresh ? 1 : 0;
  } else {
    const bg = cornerColor(d, w, h);          // 배경색 추정
    const tol = thresh * thresh * 3;
    for(let i = 0; i < w*h; i++){
      const dr = d[i*4]-bg[0], dg = d[i*4+1]-bg[1], db = d[i*4+2]-bg[2];
      fg[i] = (dr*dr + dg*dg + db*db) > tol ? 1 : 0;
    }
  }
  return fg;
}
function cornerColor(d, w, h){
  const pts = [0, (w-1), (h-1)*w, w*h-1];
  let r=0,g=0,b=0;
  pts.forEach(p => { r+=d[p*4]; g+=d[p*4+1]; b+=d[p*4+2]; });
  return [r/4, g/4, b/4];
}

/* 연결 요소(8-방향) 탐지 → 바운딩 박스 목록 */
function label(fg, w, h){
  const lab = new Int32Array(w*h);
  const boxes = [], stack = [];
  let id = 0;
  for(let s = 0; s < w*h; s++){
    if(!fg[s] || lab[s]) continue;
    id++;
    let x0 = s%w, y0 = (s/w)|0, x1 = x0, y1 = y0, area = 0;
    stack.push(s); lab[s] = id;
    while(stack.length){
      const p = stack.pop(), px = p%w, py = (p/w)|0;
      area++;
      if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py;
      for(let dy=-1; dy<=1; dy++) for(let dx=-1; dx<=1; dx++){
        if(!dx && !dy) continue;
        const nx = px+dx, ny = py+dy;
        if(nx<0||ny<0||nx>=w||ny>=h) continue;
        const np = ny*w+nx;
        if(fg[np] && !lab[np]){ lab[np] = id; stack.push(np); }
      }
    }
    boxes.push({x0, y0, x1, y1, area});
  }
  return boxes;
}

/* 간격 이내로 인접한 박스끼리 병합(반복) */
function mergeBoxes(list, gap){
  list = list.map(b => ({...b}));
  let changed = true;
  while(changed){
    changed = false;
    const out = [];
    while(list.length){
      let a = list.pop();
      for(let i = list.length-1; i >= 0; i--){
        const b = list[i];
        const near = !(a.x1+gap < b.x0 || b.x1+gap < a.x0 || a.y1+gap < b.y0 || b.y1+gap < a.y0);
        if(near){
          a = {x0:Math.min(a.x0,b.x0), y0:Math.min(a.y0,b.y0),
               x1:Math.max(a.x1,b.x1), y1:Math.max(a.y1,b.y1), area:a.area+b.area};
          list.splice(i,1); changed = true;
        }
      }
      out.push(a);
    }
    list = out;
  }
  return list;
}

/* 아이콘이 아닌 이상치 박스 제거(타일이 불필요하게 커지는 원인) */
function dropOutliers(list, w, h){
  if(list.length < 2) return list;
  // 1) 밀도가 매우 낮은 박스: 전체에 흩어진 미세 잡음/헤일로
  let f = list.filter(b => {
    const bw = b.x1-b.x0+1, bh = b.y1-b.y0+1;
    return b.area / (bw*bh) >= 0.03;
  });
  // 2) 이미지 대부분을 덮는 박스: 시트 전체를 감싼 잡음 덩어리
  f = f.filter(b => (b.x1-b.x0) < w*0.8 && (b.y1-b.y0) < h*0.8);
  if(!f.length) return list;
  // 3) 중앙값 대비 지나치게 큰 박스: 잘못 병합된 덩어리
  const dims = f.map(b => Math.max(b.x1-b.x0, b.y1-b.y0)).sort((a,b)=>a-b);
  const med = dims[dims.length>>1] || 1;
  return f.filter(b => Math.max(b.x1-b.x0, b.y1-b.y0) <= med*2.5);
}

/* 읽기 순서(위→아래, 좌→우)로 정렬 */
function sortReading(list){
  if(!list.length) return list;
  const medH = list.map(b => b.y1-b.y0).sort((a,b)=>a-b)[list.length>>1];
  const tol = medH * 0.6;
  const byY = [...list].sort((a,b)=>(a.y0+a.y1)-(b.y0+b.y1));
  const rows = [];
  byY.forEach(b => {
    const yc = (b.y0+b.y1)/2;
    const row = rows.find(r => Math.abs(r.yc - yc) < tol);
    if(row){ row.items.push(b); row.yc = (row.yc*row.items.length + yc)/(row.items.length+1); }
    else rows.push({yc, items:[b]});
  });
  return rows.flatMap(r => r.items.sort((a,b)=>a.x0-b.x0));
}

/* 원본 위에 감지 박스 오버레이 */
function drawOverlay(src, w, h){
  const cv = $('overlay'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(src, 0, 0);
  ctx.lineWidth = Math.max(2, w/500);
  ctx.strokeStyle = '#37d0bf';
  ctx.fillStyle = '#37d0bf';
  ctx.font = `${Math.max(14, w/60)}px ui-monospace, monospace`;
  boxes.forEach((b,i) => {
    ctx.strokeRect(b.x0, b.y0, b.x1-b.x0, b.y1-b.y0);
    ctx.fillText(i+1, b.x0+3, b.y0 + Math.max(16, w/55));
  });
  $('count').textContent = boxes.length;
}

/* 균일 크기 타일 생성(스케일 없이 중앙 배치) */
function makeTiles(src){
  const pad = +$('pad').value;
  let maxW = 0, maxH = 0;
  boxes.forEach(b => { maxW = Math.max(maxW, b.x1-b.x0+1); maxH = Math.max(maxH, b.y1-b.y0+1); });
  const manual = parseInt($('tileSize').value);
  const side = manual > 0 ? manual : Math.max(maxW, maxH) + pad*2;

  const wrap = $('tiles'); wrap.innerHTML = ''; tileCanvases = [];
  if(!boxes.length){ wrap.innerHTML = '<div class="empty">감지된 아이콘이 없습니다</div>'; $('download').disabled = true; return; }
  $('dims').textContent = `${side}×${side}px`;

  boxes.forEach((b,i) => {
    const bw = b.x1-b.x0+1, bh = b.y1-b.y0+1;
    const cv = document.createElement('canvas'); cv.width = side; cv.height = side;
    const ctx = cv.getContext('2d');
    ctx.drawImage(src, b.x0, b.y0, bw, bh, (side-bw)/2, (side-bh)/2, bw, bh);
    tileCanvases.push(cv);

    const cell = document.createElement('div'); cell.className = 'tile checker';
    cell.title = '클릭해서 개별 저장';
    cell.onclick = () => saveCanvas(cv, `${$('prefix').value}_${String(i+1).padStart(2,'0')}.png`);
    const tag = document.createElement('span'); tag.textContent = i+1;
    cell.append(cv, tag); wrap.append(cell);
  });
  $('download').disabled = false;
}

/* ---------- 저장 ---------- */
function saveCanvas(cv, name){
  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    URL.revokeObjectURL(a.href);
  });
}
$('download').onclick = async () => {
  const zip = new JSZip();
  const prefix = $('prefix').value;
  await Promise.all(tileCanvases.map((cv,i) =>
    new Promise(res => cv.toBlob(b => { zip.file(`${prefix}_${String(i+1).padStart(2,'0')}.png`, b); res(); }))
  ));
  const blob = await zip.generateAsync({type:'blob'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `${prefix}s.zip`; a.click();
  URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
