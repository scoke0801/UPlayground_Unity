<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown Viewer</title>
  <meta name="description" content="브라우저에서 바로 사용하는 단일 파일 Markdown Viewer" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #181b22;
      --panel-2: #20242d;
      --line: #303642;
      --text: #e7eaf0;
      --muted: #9aa3b2;
      --accent: #6ea8fe;
      --accent-2: #8cb4ff;
      --danger: #ff7b72;
      --shadow: 0 18px 45px rgba(0, 0, 0, .28);
      --radius: 14px;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-2: #f7f9fb;
      --line: #d9dee6;
      --text: #1f2328;
      --muted: #667085;
      --accent: #0969da;
      --accent-2: #0550ae;
      --danger: #cf222e;
      --shadow: 0 18px 45px rgba(31, 35, 40, .12);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    button, input, textarea { font: inherit; }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: 8px;
      font-weight: 800;
      letter-spacing: -.02em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .file-name {
      min-width: 120px;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 13px;
    }

    .spacer { flex: 1; }

    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      min-height: 36px;
      padding: 0 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: .16s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      transform: translateY(-1px);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(260px, 38%) 8px minmax(0, 62%);
      padding: 12px;
      gap: 0;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .panel-head {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .editor-wrap,
    .preview-wrap {
      min-height: 0;
      position: relative;
    }

    #editor {
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: none;
      padding: 18px;
      color: var(--text);
      background: transparent;
      font: 14px/1.65 "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      tab-size: 2;
    }

    .preview-wrap {
      overflow: auto;
      scroll-behavior: smooth;
    }

    #preview {
      max-width: 980px;
      margin: 0 auto;
      padding: 30px clamp(22px, 5vw, 64px) 70px;
      line-height: 1.72;
      overflow-wrap: anywhere;
    }

    #preview > :first-child { margin-top: 0; }
    #preview > :last-child { margin-bottom: 0; }

    #preview h1,
    #preview h2,
    #preview h3,
    #preview h4,
    #preview h5,
    #preview h6 {
      line-height: 1.28;
      margin: 1.65em 0 .65em;
      font-weight: 850;
      letter-spacing: -.025em;
    }

    #preview h1 { font-size: 2.15rem; padding-bottom: .35em; border-bottom: 1px solid var(--line); }
    #preview h2 { font-size: 1.62rem; padding-bottom: .32em; border-bottom: 1px solid var(--line); }
    #preview h3 { font-size: 1.3rem; }
    #preview p, #preview ul, #preview ol, #preview blockquote, #preview pre, #preview table { margin: 0 0 1rem; }
    #preview ul, #preview ol { padding-left: 1.65rem; }
    #preview li + li { margin-top: .3rem; }

    #preview a { color: var(--accent); text-decoration: none; }
    #preview a:hover { text-decoration: underline; }

    #preview blockquote {
      border-left: 4px solid var(--accent);
      margin-left: 0;
      padding: .45rem 1rem;
      color: var(--muted);
      background: color-mix(in srgb, var(--accent) 6%, transparent);
      border-radius: 0 8px 8px 0;
    }

    #preview code {
      padding: .15em .38em;
      border-radius: 6px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      font: .9em/1.45 "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    }

    #preview pre {
      overflow: auto;
      padding: 16px;
      border-radius: 10px;
      background: #0d1117;
      border: 1px solid var(--line);
    }

    :root[data-theme="light"] #preview pre { background: #f6f8fa; }
    #preview pre code { padding: 0; border: 0; background: transparent; color: inherit; }

    #preview img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.2rem auto;
      border-radius: 10px;
      border: 1px solid var(--line);
    }

    #preview table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    #preview th, #preview td {
      border: 1px solid var(--line);
      padding: 9px 12px;
      text-align: left;
    }

    #preview th { background: var(--panel-2); }
    #preview tr:nth-child(2n) td { background: color-mix(in srgb, var(--panel-2) 55%, transparent); }
    #preview hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
    #preview input[type="checkbox"] { margin-right: .5rem; }

    .divider {
      cursor: col-resize;
      position: relative;
    }

    .divider::after {
      content: "";
      position: absolute;
      inset: 14px 2px;
      border-radius: 99px;
      background: var(--line);
      transition: .16s;
    }

    .divider:hover::after,
    .divider.dragging::after { background: var(--accent); }

    .drop-hint {
      position: fixed;
      inset: 14px;
      z-index: 999;
      display: none;
      place-items: center;
      border: 2px dashed var(--accent);
      border-radius: 18px;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      color: var(--text);
      font-weight: 850;
      font-size: clamp(18px, 3vw, 30px);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .drop-hint.visible { display: grid; }

    .empty-state {
      min-height: 55vh;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
    }

    .empty-state strong { color: var(--text); font-size: 1.25rem; }

    .status {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translate(-50%, 14px);
      opacity: 0;
      pointer-events: none;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      box-shadow: var(--shadow);
      transition: .18s ease;
      font-size: 13px;
      z-index: 1000;
    }

    .status.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100%; }
      .toolbar { flex-wrap: wrap; }
      .file-name { order: 3; width: 100%; max-width: none; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: 46vh 12px minmax(52vh, auto); }
      .divider { cursor: row-resize; }
      .divider::after { inset: 4px 14px; }
      .panel { min-height: 0; }
      #preview { padding-inline: 20px; }
    }

    @media print {
      body { background: white; color: black; overflow: visible; }
      .toolbar, .editor-panel, .divider { display: none !important; }
      .app, .workspace, .panel, .preview-wrap { display: block; height: auto; overflow: visible; border: 0; box-shadow: none; padding: 0; }
      #preview { max-width: none; padding: 0; color: black; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="brand">
        <div class="brand-mark">M↓</div>
        <span>Markdown Viewer</span>
      </div>
      <span id="fileName" class="file-name">새 문서.md</span>
      <button id="openBtn" class="btn primary" type="button">파일 열기</button>
      <button id="clearBtn" class="btn" type="button">초기화</button>
      <div class="spacer"></div>
      <button id="copyBtn" class="btn" type="button">HTML 복사</button>
      <button id="printBtn" class="btn" type="button">인쇄 / PDF</button>
      <button id="themeBtn" class="btn" type="button" aria-label="테마 전환">☀️</button>
      <input id="fileInput" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden />
    </header>

    <main id="workspace" class="workspace">
      <section class="panel editor-panel">
        <div class="panel-head">Markdown</div>
        <div class="editor-wrap">
          <textarea id="editor" spellcheck="false" aria-label="Markdown 편집기"></textarea>
        </div>
      </section>

      <div id="divider" class="divider" role="separator" aria-orientation="vertical" aria-label="패널 크기 조절"></div>

      <section class="panel preview-panel">
        <div class="panel-head">Preview</div>
        <div id="previewWrap" class="preview-wrap">
          <article id="preview"></article>
        </div>
      </section>
    </main>
  </div>

  <div id="dropHint" class="drop-hint">Markdown 파일을 놓으세요</div>
  <div id="status" class="status" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (() => {
      const editor = document.getElementById('editor');
      const preview = document.getElementById('preview');
      const previewWrap = document.getElementById('previewWrap');
      const fileInput = document.getElementById('fileInput');
      const fileName = document.getElementById('fileName');
      const openBtn = document.getElementById('openBtn');
      const clearBtn = document.getElementById('clearBtn');
      const copyBtn = document.getElementById('copyBtn');
      const printBtn = document.getElementById('printBtn');
      const themeBtn = document.getElementById('themeBtn');
      const divider = document.getElementById('divider');
      const workspace = document.getElementById('workspace');
      const dropHint = document.getElementById('dropHint');
      const status = document.getElementById('status');

      const SAMPLE = `# Markdown Viewer

Markdown 파일을 **드래그앤드롭**하거나, 왼쪽 편집기에 직접 입력하세요.

## 지원 기능

- 실시간 미리보기
- 표, 체크박스, 코드 블록
- 다크 / 라이트 테마
- HTML 복사
- 인쇄 및 PDF 저장

### 코드 예시

\`\`\`csharp
public class HelloMarkdown
{
    public static void Main()
    {
        Console.WriteLine("Hello, Markdown!");
    }
}
\`\`\`

### 표 예시

| 기능 | 지원 |
|---|---:|
| Markdown 파일 열기 | ✅ |
| 드래그앤드롭 | ✅ |
| 브라우저 단독 실행 | ✅ |

> 브라우저 보안 정책상 외부 이미지와 링크는 원본 주소를 사용합니다.
`;

      marked.setOptions({
        gfm: true,
        breaks: false,
        mangle: false,
        headerIds: true
      });

      const escapeHtml = (value) => value
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      const sanitizeHtml = (html) => {
        const template = document.createElement('template');
        template.innerHTML = html;

        template.content.querySelectorAll('script, iframe, object, embed, form, style').forEach(el => el.remove());

        template.content.querySelectorAll('*').forEach(el => {
          [...el.attributes].forEach(attr => {
            const name = attr.name.toLowerCase();
            const value = attr.value.trim().toLowerCase();
            if (name.startsWith('on')) el.removeAttribute(attr.name);
            if ((name === 'href' || name === 'src') && value.startsWith('javascript:')) {
              el.removeAttribute(attr.name);
            }
          });
        });

        return template.innerHTML;
      };

      const render = () => {
        const value = editor.value;
        if (!value.trim()) {
          preview.innerHTML = '<div class="empty-state"><div><strong>표시할 내용이 없습니다.</strong><br><br>Markdown을 입력하거나 파일을 열어주세요.</div></div>';
          return;
        }

        try {
          const raw = marked.parse(value);
          preview.innerHTML = sanitizeHtml(raw);
          preview.querySelectorAll('a').forEach(link => {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          });
        } catch (error) {
          preview.innerHTML = `<pre><code>${escapeHtml(String(error))}</code></pre>`;
        }
      };

      let renderTimer = null;
      const scheduleRender = () => {
        clearTimeout(renderTimer);
        renderTimer = setTimeout(() => {
          render();
          localStorage.setItem('md-viewer-content', editor.value);
        }, 70);
      };

      const showStatus = (message) => {
        status.textContent = message;
        status.classList.add('show');
        clearTimeout(showStatus.timer);
        showStatus.timer = setTimeout(() => status.classList.remove('show'), 1500);
      };

      const loadFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          editor.value = String(reader.result ?? '');
          fileName.textContent = file.name;
          render();
          localStorage.setItem('md-viewer-content', editor.value);
          showStatus(`${file.name} 파일을 열었습니다.`);
        };
        reader.onerror = () => showStatus('파일을 읽지 못했습니다.');
        reader.readAsText(file, 'utf-8');
      };

      openBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', () => loadFile(fileInput.files?.[0]));

      clearBtn.addEventListener('click', () => {
        editor.value = '';
        fileName.textContent = '새 문서.md';
        localStorage.removeItem('md-viewer-content');
        render();
        editor.focus();
      });

      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(preview.innerHTML);
          showStatus('렌더링된 HTML을 복사했습니다.');
        } catch {
          showStatus('클립보드 복사에 실패했습니다.');
        }
      });

      printBtn.addEventListener('click', () => window.print());

      const applyTheme = (theme) => {
        document.documentElement.dataset.theme = theme;
        themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
        localStorage.setItem('md-viewer-theme', theme);
      };

      themeBtn.addEventListener('click', () => {
        const current = document.documentElement.dataset.theme || 'dark';
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });

      editor.addEventListener('input', scheduleRender);
      editor.addEventListener('keydown', (event) => {
        if (event.key === 'Tab') {
          event.preventDefault();
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          editor.setRangeText('  ', start, end, 'end');
          scheduleRender();
        }
      });

      let dragDepth = 0;
      window.addEventListener('dragenter', (event) => {
        event.preventDefault();
        dragDepth += 1;
        dropHint.classList.add('visible');
      });
      window.addEventListener('dragover', event => event.preventDefault());
      window.addEventListener('dragleave', (event) => {
        event.preventDefault();
        dragDepth -= 1;
        if (dragDepth <= 0) {
          dragDepth = 0;
          dropHint.classList.remove('visible');
        }
      });
      window.addEventListener('drop', (event) => {
        event.preventDefault();
        dragDepth = 0;
        dropHint.classList.remove('visible');
        loadFile(event.dataTransfer?.files?.[0]);
      });

      let isResizing = false;
      divider.addEventListener('pointerdown', (event) => {
        isResizing = true;
        divider.classList.add('dragging');
        divider.setPointerCapture(event.pointerId);
      });

      divider.addEventListener('pointermove', (event) => {
        if (!isResizing || window.innerWidth <= 820) return;
        const rect = workspace.getBoundingClientRect();
        const relative = Math.max(260, Math.min(event.clientX - rect.left, rect.width - 340));
        const leftPercent = (relative / rect.width) * 100;
        workspace.style.gridTemplateColumns = `${leftPercent}% 8px minmax(0, 1fr)`;
      });

      const finishResize = () => {
        isResizing = false;
        divider.classList.remove('dragging');
      };
      divider.addEventListener('pointerup', finishResize);
      divider.addEventListener('pointercancel', finishResize);

      const savedTheme = localStorage.getItem('md-viewer-theme');
      const systemLight = window.matchMedia?.('(prefers-color-scheme: light)').matches;
      applyTheme(savedTheme || (systemLight ? 'light' : 'dark'));

      editor.value = localStorage.getItem('md-viewer-content') || SAMPLE;
      render();
    })();
  </script>
</body>
</html>
