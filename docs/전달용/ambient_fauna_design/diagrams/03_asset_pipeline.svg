<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" role="img" aria-label="에셋이 있으면 재사용, 부족한 부분만 제작"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#78999c"/></marker></defs><rect width="1120" height="680" rx="18" fill="#122a35"/><g font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="42" font-size="24" font-weight="700" fill="#f0f5ed">에셋이 있으면 재사용, 부족한 부분만 제작</text><text x="32" y="70" font-size="14" fill="#b6c9ca">이 문서는 제작 절차를 정의한다. 아래 단계의 실제 실행 결과가 아니다.</text><rect x="32" y="100" width="1056" height="80" rx="12" fill="#325c60" stroke="#54757b" stroke-width="1"/><text x="560.0" y="130" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">프로젝트 자산 조사</text><text x="560.0" y="156" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">실제 경로 / GUID / 메시 / 텍스처 / 스타일 / 사용권 / 변형 가능성</text><path d="M152 180 L152 220" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="220" width="240" height="90" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="152.0" y="250" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">ReuseAsIs</text><text x="152.0" y="276" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">그대로 사용할 수 있음</text><path d="M424 180 L424 220" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><rect x="304" y="220" width="240" height="90" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="424.0" y="250" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">DeriveForGpu</text><text x="424.0" y="276" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">GPU용 변환으로 사용</text><path d="M696 180 L696 220" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="220" width="240" height="90" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="696.0" y="250" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">ReusePartial</text><text x="696.0" y="276" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">일부만 적합함</text><path d="M968 180 L968 220" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><rect x="848" y="220" width="240" height="90" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="968.0" y="250" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">NewRequired</text><text x="968.0" y="276" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">적합한 후보가 없음</text><path d="M152 310 L152 342" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="342" width="240" height="90" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="152.0" y="372" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">원본 참조</text><text x="152.0" y="398" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">기존 모델·텍스처 유지</text><path d="M424 310 L424 342" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><rect x="304" y="342" width="240" height="90" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="424.0" y="372" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">파생 메시·재질</text><text x="424.0" y="398" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">정적화 / 축 / hinge / LOD</text><path d="M696 310 L696 342" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="342" width="240" height="90" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="696.0" y="372" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">누락 부분 제작</text><text x="696.0" y="398" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">모델 또는 텍스처만 보충</text><path d="M968 310 L968 342" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><rect x="848" y="342" width="240" height="90" rx="12" fill="#203e4a" stroke="#54757b" stroke-width="1"/><text x="968.0" y="372" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">신규 외형 제작</text><text x="968.0" y="398" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">Blender MCP + ImageGen</text><path d="M152 432 L152 462 L560 462 L560 492" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><path d="M424 432 L424 462 L560 462 L560 492" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><path d="M696 432 L696 462 L560 462 L560 492" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><path d="M968 432 L968 462 L560 462 L560 492" fill="none" stroke="#78999c" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="492" width="560" height="80" rx="12" fill="#325c60" stroke="#54757b" stroke-width="1"/><text x="560.0" y="522" font-size="18" fill="#f0f5ed" text-anchor="middle" font-weight="700">공통 최종 검증</text><text x="560.0" y="548" font-size="14" fill="#b6c9ca" text-anchor="middle" font-weight="400">UV·알파 → Unity 임포트 → GPU 날갯짓 → 인게임 외형</text><text x="560" y="615" font-size="16" fill="#ebd7a7" text-anchor="middle" font-weight="400">모델 원본 · 생성 원본 · 프롬프트 · 가공 과정 · 최종 에셋을 manifest로 추적</text><text x="560" y="646" font-size="15" fill="#b6c9ca" text-anchor="middle" font-weight="400">Unresolved는 “없음”이 아니다. 원본을 덮어쓰지 않는다.</text></g></svg>